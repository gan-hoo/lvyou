name: iOS Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build (Release, iphoneos, no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project TravelFootprints.xcodeproj \
            -scheme TravelFootprints \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning:|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/TravelFootprints.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TravelFootprints.app Payload/
          zip -qry TravelFootprints-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TravelFootprints-unsigned-ipa
          path: TravelFootprints-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

  test:
    name: Unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run tests on an available iPhone simulator
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in data if "iOS" in k), reverse=True)
          for runtime in ios:
              for d in data[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit(1)')
          echo "Simulator: $DEVICE_ID"
          xcodebuild test \
            -project TravelFootprints.xcodeproj \
            -scheme TravelFootprints \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "error:|✔|✘|passed|failed|TEST" || true
          grep -q "TEST SUCCEEDED" test.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log
          path: test.log
