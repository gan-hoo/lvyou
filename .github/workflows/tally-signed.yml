name: Tally signed IPA

# Manually triggered. Requires these repository secrets:
#   TALLY_CERT_P12_BASE64      base64 of an Apple Development / Distribution .p12
#   TALLY_CERT_PASSWORD        password of that .p12
#   TALLY_PROFILE_BASE64       base64 of the matching .mobileprovision
#   TALLY_TEAM_ID              10-character Apple team ID
# The provisioning profile's App ID must match the bundle id input.

on:
  workflow_dispatch:
    inputs:
      method:
        description: Export method
        type: choice
        options: [development, release-testing, app-store-connect]
        default: development
      bundle_id:
        description: Bundle identifier (must match the profile)
        default: com.ganhoo.tally

jobs:
  signed:
    runs-on: macos-15
    defaults:
      run:
        working-directory: Tally
    env:
      CERT_P12: ${{ secrets.TALLY_CERT_P12_BASE64 }}
      CERT_PASSWORD: ${{ secrets.TALLY_CERT_PASSWORD }}
      PROFILE: ${{ secrets.TALLY_PROFILE_BASE64 }}
      TEAM_ID: ${{ secrets.TALLY_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for v in CERT_P12 CERT_PASSWORD PROFILE TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v — see Tally/README.md › Signing"; exit 1; fi
          done

      - name: Install certificate and profile
        run: |
          KEYCHAIN="$RUNNER_TEMP/tally.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"; cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$UUID.mobileprovision"
          done
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Profile: $NAME  Identity: $IDENTITY"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Tally.xcodeproj -scheme Tally -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Tally.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ inputs.bundle_id }}" \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            | tee archive.log | grep -E "error:|ARCHIVE" || true
          test -d build/Tally.xcarchive

      - name: Export IPA
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${{ inputs.method }}</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$SIGN_IDENTITY</string>
            <key>provisioningProfiles</key><dict>
              <key>${{ inputs.bundle_id }}</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Tally.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist
          ls -la build/export

      - uses: actions/upload-artifact@v4
        with:
          name: Tally-signed-${{ inputs.method }}
          path: Tally/build/export/*.ipa

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/tally.keychain-db" || true
